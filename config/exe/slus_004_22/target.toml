# Load reservations: zero-filled windows whose only nonzero bytes are the
# stamps retail writes at the start (a slot or pad id). The link writes them
# as fills instead of extracting them from the payload; the bytes are checked
# against the extracted binary before it links.
[[regions]]
role = "slot"
name = "slot_80096800_main_exe"
offset = 0x800
size = 0x2B000
fill = 0
words = [[0x0, 0x00000009]]

