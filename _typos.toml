# _typos.toml — the project's own words, for crate-ci/typos
#
# Run `typos` from the repository root to check this repository's own text. The
# dictionary holds the words the tool would otherwise "correct" but that are
# correct here: the PsyQ SDK's names, the console's hardware vocabulary, and
# the game's own spelling.
#
# Every entry is a word the tree uses and the tool has no reason to change.
# A word is only here because a reader would call the correction wrong.

[files]
extend-exclude = ["build/", "toolchains/", "third_party/", "inputs/", "asm/", ".venv/", "work/", ".git/"]

[default]
# The tool reports; it never rewrites a file.
check-filename = true
check-file = true
binary = false
unicode = true
locale = "en"
# Hex literals and retail addresses carry letters that read as words.
extend-ignore-re = ["\\b0[xX][0-9A-Fa-f]{4,}\\b", "\\b(?:func|D|jtbl)_[0-9A-Fa-f]{4,}\\b"]
# The SDK's identifiers: a name the PsyQ headers own is not a misspelling.
extend-ignore-identifiers-re = [
  "\\bCd[A-Z][A-Za-z0-9]*\\b",
  "\\bPad[A-Z][A-Za-z0-9]*\\b",
  "\\bSnd[A-Z][A-Za-z0-9]*\\b",
  "\\bSpu[A-Z][A-Za-z0-9]*\\b",
  "\\bGte[A-Z][A-Za-z0-9]*\\b",
  "\\bGs[A-Z][A-Za-z0-9]*\\b",
  "\\b(?:DMA|VRAM|GPU|OTC|SPU|SIO|TMR|MDEC|CDROM|GTE|GS|IMU|RAM|ROM|BRAM|SSRAM|MSR|BCR|CHCR|MADR|DPCR|DICR|I_STAT|I_MASK)\\b",
  "\\b(?:PsyQ|psyq|EMI|emi|SLUS|slus|CC1PSX|ASPSX|maspsx|OVERLAY|overlay|CLUT|GPUB|OT)\\b",
  "\\bslus_\\d{2}_\\d{2}_\\d{2}\\b",
  "\\bpsyq[-\\w.]*\\b",
  "\\b[us](?:8|16|32|64)\\b",
  # The tool reads a C type as a word: these are the project's fixed-width names.
  "\\b(?:s32|u32|s16|u16|s8|u8|s64|u64)\\b",
  # The retail register macros: hw.h names them after the hardware.
  "\\b(?:HW_REF|SP_REF|SP_PTR|SP|MEM|MEM_PTR|FIELD|FIELD_PTR)\\b",
  # A symbol whose name carries the tail of its address: `g_BattleByte63BA`,
  # `tu_8019DAA0`, `func_801ABD68`. The letters are the address, not a word.
  "\\b[A-Za-z_][A-Za-z0-9_]*[0-9]{2}[A-Z]{2,3}\\b",
  # A hex tail inside a longer identifier: `8016BA04`, `8019DAA0`.
  "\\b[0-9A-Fa-f]{4,}[A-Z]{2,3}[0-9A-Fa-f]*\\b",
  # The same tail in an all-caps identifier: `ABILITY_TARGET_SINGLE_BOTH_RANDOM_BA`,
  # `BOF3_OBJFLAGS_..._func_801ABD68_c`.
  "\\b[A-Z0-9_]*[0-9]{2}[A-Z]{2,3}[A-Z0-9_]*\\b",
  # GCC 2.7.2's own vocabulary, quoted in the docs.
  "\\bgivs?\\b",
  "\\bbivs?\\b",
  "\\blicm\\b",
  "\\baranges\\b",
  "\\brela\\b",
]

[default.extend-words]
# --- Sony PsyQ SDK and the console ------------------------------------------
PsyQ = "PsyQ"
psyq = "psyq"
Psyq = "Psyq"
CDROM = "CDROM"
Cdrom = "Cdrom"
cdrom = "cdrom"
CdRead = "CdRead"
CdControl = "CdControl"
CdSync = "CdSync"
CdReady = "CdReady"
PadInit = "PadInit"
PadRead = "PadRead"
Snd = "Snd"
SndPlay = "SndPlay"
GsOT = "GsOT"
VRAM = "VRAM"
Vram = "Vram"
DMA = "DMA"
Dma = "Dma"
TS = "TS"
OT = "OT"
SPAD = "SPAD"
SpadWork = "SpadWork"
poly = "poly"
Poly = "Poly"
EMI = "EMI"
emi = "emi"
Slus = "Slus"
slus = "slus"
beff = "beff"
n64 = "n64"
arcade = "arcade"
emulator = "emulator"
emulation = "emulation"
# --- The event and error names the kernel headers own ------------------------
TIMOUT = "TIMOUT"
INTERRRUPT = "INTERRRUPT"
Desable = "Desable"
# --- The game's own words ----------------------------------------------------
# Retail strings retain the disc spelling "faerie"; code uses "fairy".
faerie = "faerie"
# The notes write British "colour"; the data tables write "color". Both stand.
colour = "colour"
color = "color"
# The character's name in the hide-and-seek table.
Bais = "Bais"
BAIS = "BAIS"
bais = "bais"
# The ordering table: the graphics vocabulary.
ot = "ot"
ot_index = "ot_index"
ot_layer = "ot_layer"
# --- GCC 2.7.2's own vocabulary, quoted in the docs ---------------------------
giv = "giv"
givs = "givs"
biv = "biv"
bivs = "bivs"
licm = "licm"
aranges = "aranges"
rela = "rela"
# --- Tool and format vocabulary ----------------------------------------------
unparseable = "unparseable"
truncat = "truncat"
schedul = "schedul"
shft = "shft"
aloc = "aloc"
sav = "sav"
Iinclude = "Iinclude"
CHEKLIST = "CHEKLIST"
# --- The game's own words in identifiers --------------------------------------
# A tile map's row and column: `ix` and `iy` are the project's own pair.
iy = "iy"
ix = "ix"
# --- The retail disassembly's register names, quoted in the notes.
thr = "thr"
# --- The tail of a retail address, read as a word --------------------------------
# The tool splits an identifier at its case boundaries, so `ABILITY_..._RANDOM_BA`
# and `tu_8016BA04` reach it as the word `BA`. The letters are the address.
BA = "BA"
ABD = "ABD"
DAA = "DAA"
AFE = "AFE"
DBE = "DBE"
DED = "DED"
DAED = "DAED"
ADDD = "ADDD"
EACF = "EACF"
CAF = "CAF"
# A byte offset the seam macro names: FIELD, MEM, SP.
FIEL = "FIEL"
# The project's status word: a MATCHed function.
MATC = "MATC"
Hed = "Hed"
