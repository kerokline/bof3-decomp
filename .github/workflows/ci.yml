name: ci

# Pushes to main and public PRs run what needs no disc. The byte-exact `check` target runs on the maintainer's
# machine before merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disc-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5
        with:
          cache: true
      - run: uv sync --locked --group dev
      - run: uv tool install clang-format
      - run: uv tool install meson
      - run: uv tool install ninja
      - name: Compare with main
        run: |
          git fetch --no-tags origin +main:refs/remotes/origin/main
          git update-ref refs/heads/main refs/remotes/origin/main
      - name: Shell syntax
        run: for script in tools/*.sh bin/*; do [ -f "$script" ] && sh -n "$script"; done; true
      # dprint/check already checks Markdown and TOML above.
      - run: DPRINT=true tools/format.sh --check
      - run: meson setup build/meson
      - run: meson compile -C build/meson check-tree include-asm
      - run: meson test -C build/meson --print-errorlogs
