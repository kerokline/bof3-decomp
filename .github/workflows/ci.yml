name: ci

# Every push to main and every pull request runs the checks that need no disc. The byte-exact
# `check` target needs the game and runs on the maintainer's machine before merge.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disc-free:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5
        with:
          dprint-version: 0.64.3
          cache: true
      - run: uv sync --locked --group dev
      - run: uv tool install clang-format==23.1.3
      - run: uv tool install meson==1.12.1
      - run: uv tool install ninja==1.13.0
      - name: Compare with main
        run: |
          git fetch --no-tags origin +main:refs/remotes/origin/main
          git update-ref refs/heads/main refs/remotes/origin/main
      - name: Shell syntax
        run: git ls-files 'tools/*.sh' 'bin/*' | xargs -n 1 sh -n
      # dprint/check above covers Markdown, TOML and JSON; DPRINT=true skips the second run.
      - name: Format
        run: DPRINT=true tools/format.sh --check
      - run: meson setup build/meson
      - run: meson compile -C build/meson check-tree include-asm
      - run: meson test -C build/meson --print-errorlogs
