[project]
name = "rebof3"
version = "0.1.0"
license = "CC0-1.0"
description = "Local BOF3 PSX reverse-engineering tools"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0",
  # The splitter and the disassembler, pinned by uv.lock.
  "splat64[mips]==0.41.1",
  "spimdisasm==1.42.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff==0.15.11"]
matching = ["colorama>=0.4.6", "levenshtein>=0.27.0", "toml>=0.10.2", "watchdog>=6.0.0"]

[tool.uv]
default-groups = []
python-downloads = "manual"

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tools/tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
