# PsyQ 3.7 objects (psyq_lib_3_7) are the retail link's own libraries; the startup objects 2MBYTE.OBJ and NONE3.OBJ do not convert.
[sdk]
[sdk.libs]
LIBAPI = "3.7"
LIBC = "3.7"
LIBCARD = "3.7"
LIBCD = "3.7"
LIBETC = "3.7"
LIBGPU = "3.7"
LIBGTE = "3.7"
LIBSND = "3.7"
LIBSPU = "3.7"

[psyq]
[psyq.libraries.LIBGPU]
members = ["psyq/3.7/libgpu/ext.o"]
